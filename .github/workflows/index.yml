name: index

# Builds and publishes the NebulaOS package index (GitHub Pages, gh-pages).
# Daily, so new releases of Moonraker/Klipper requirements appear without
# anyone doing anything; manually; and on changes to the scripts.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: index
  cancel-in-progress: false

env:
  # The NebulaOS firmware build image (manifests/dependencies.conf
  # BUILD_IMAGE_REPO/BUILD_IMAGE_DIGEST): the SDK's host tools were built in it.
  BUILD_IMAGE: ghcr.io/coreflake1/nebulaos-build@sha256:a6ba57c69fa1ea630b037a1d1f55cf0c044a7f5a403bde9b155ea54bca1cceba

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Self-test (index scripts)
        run: sh tests/run-tests.sh

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Requirements of the app updates a printer can install
        run: |
          sh scripts/collect-requirements.sh reqs || { echo "collect-requirements.sh failed (no requirements, nothing built)" >> failures.txt; exit 1; }
          cat reqs/*.txt

      - name: Current index
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git fetch origin gh-pages --depth 1
            git worktree add site origin/gh-pages
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet . || true
          fi
          touch site/.nojekyll

      - name: Build, check and add wheels for every SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-all.sh reqs site failures.txt

      - name: Publish
        if: always()
        run: |
          [ -d site ] || { echo "no site"; exit 0; }
          cd site
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="nebulaos-index" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "index: $(date -u +%Y-%m-%dT%H:%MZ) ($GITHUB_SHA)"
          git push origin gh-pages

      # Whatever built is published above; anything that did not build or was
      # rejected by the ABI check makes the run red and is reported in one
      # GitHub issue (opened, or commented on while it stays open).
      - name: Report failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s failures.txt ] && [ "${{ job.status }}" != "success" ]; then
            echo "a workflow step failed (${{ job.status }}) - see the run log" > failures.txt
          fi
          [ -s failures.txt ] || { echo "no failures"; exit 0; }
          cat failures.txt
          TITLE="Index build failures"
          BODY=$(printf 'Run %s/%s/actions/runs/%s\n\n```\n%s\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(head -c 60000 failures.txt)")
          N=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
          exit 1
