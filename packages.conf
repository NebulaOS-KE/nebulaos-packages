# Per-package build settings for cross-building against a NebulaOS SDK.
# One line per package: <name> <pip --config-settings ...>
# A package listed here is built on its own, first, with exactly these
# settings; every other package is built with the defaults.
#
# Pillow: only the libraries the NebulaOS image ships (zlib, freetype); a
# feature linking a library the image does not have would be rejected by
# check-wheels.py anyway. platform-guessing=disable keeps the build machine's
# /usr/include out (as Buildroot's own python-pillow does).
#
# Dependencies of dependencies are switched through environment variables in
# scripts/build-wheels.sh instead (PyYAML: PYYAML_FORCE_LIBYAML=0).
pillow -Cplatform-guessing=disable -Czlib=enable -Cfreetype=enable -Cjpeg=disable -Ctiff=disable -Cwebp=disable -Cavif=disable -Clcms=disable -Cimagequant=disable -Craqm=disable -Cxcb=disable -Cjpeg2000=disable
